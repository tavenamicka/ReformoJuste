[package]
name = "reformojuste"
version = "1.0.0"
edition = "2021"
license = "MIT"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri        = { version = "1.6", features = [ "window-start-dragging", "system-tray", "window-hide", "notification"] }
serde        = { version = "1",   features = ["derive"] }
serde_json   = "1"
tokio        = { version = "1",   features = ["full"] }
reqwest      = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
rdev         = "0.5"
arboard      = "3"
anyhow       = "1"
async-trait  = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
] }
# Clé Run de HKCU (démarrage automatique) — déjà présent dans l'arbre via reqwest/tauri
winreg = "0.52"

[profile.release]
panic        = "abort"
codegen-units = 1
lto          = true
opt-level    = "s"
strip        = true
