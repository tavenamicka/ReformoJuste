name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  rust-check:
    # Verifie seulement la compilation du cote Rust/Tauri (cargo check).
    # L'app cible Windows (distribution portable via distribute.ps1) : ce
    # runner Linux ne peut ni compiler la cible finale ni executer de tests
    # (aucune suite de tests sur ce depot actuellement) - ce job attrape les
    # erreurs de code cote Rust, rien de plus.
    # ubuntu-22.04 plutot que ubuntu-latest (24.04) : Tauri v1 depend du crate
    # soup2-sys (libsoup 2.4), incompatible avec libwebkit2gtk-4.1/libsoup3
    # qui a remplace la 4.0 sur 24.04 (echec de build confirme). 22.04 a
    # encore les paquets 4.0 d'origine.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependances systeme Tauri v1 (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.0-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup2.4-dev build-essential libssl-dev
      - name: Config locale factice (config.json est gitignore, requis par tauri-build au build)
        run: cp config.example.json config.json
      - name: Installe Rust (absent de l'image de base)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo check --manifest-path src-tauri/Cargo.toml
