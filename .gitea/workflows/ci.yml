name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  rust-check:
    # Verifie seulement la compilation du cote Rust/Tauri (cargo check).
    # L'app cible Windows (distribution portable via distribute.ps1) : ce
    # runner Linux ne peut ni compiler la cible finale ni executer de tests
    # (aucune suite de tests sur ce depot actuellement) - ce job attrape les
    # erreurs de code cote Rust, rien de plus.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependances systeme Tauri v1 (Linux)
        run: |
          sudo apt-get update
          # webkit2gtk-4.0 n'existe plus sur Ubuntu 24.04 (runner ubuntu-latest) :
          # paquet renomme en 4.1.
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev build-essential libssl-dev
      - run: cargo check --manifest-path src-tauri/Cargo.toml
